spring.application.name=WARANGAL 360
server.port=8080

# Database Configuration (Default MySQL with H2 fallback capability)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/warangal360?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=${UPLOAD_DIR:./uploads}

# JWT Secret
app.jwt.secret=${JWT_SECRET:Warangal360SuperSecretSecurityKeyWithHighEntropyAndLength2026!}
app.jwt.expiration-ms=86400000

# AI Configuration (Gemini API or intelligent simulation if key not set)
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-1.5-flash}

# SLA Scheduler frequency in ms (15 minutes = 900000)
app.sla.check-interval-ms=900000
